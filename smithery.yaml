# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['src/index.js'], env: { PAYMENTS_APP_ID: config.paymentsAppId, PAYMENTS_APP_SECRET: config.paymentsAppSecret, TOOLS: config.tools, ENV: config.env } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - paymentsAppId
      - paymentsAppSecret
      - tools
    properties:
      paymentsAppId:
        type: string
        description: Client ID for Payment Gateway
      paymentsAppSecret:
        type: string
        description: Client Secret for Payment Gateway
      tools:
        type: string
        description: Comma-separated list of tools to enable (pg)
      env:
        type: string
        default: sandbox
        description: "Environment: sandbox or production"
  exampleConfig:
    paymentsAppId: test_pg_id
    paymentsAppSecret: test_pg_secret
    tools: pg
    env: sandbox
